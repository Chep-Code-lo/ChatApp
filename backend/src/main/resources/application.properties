server.port=8080
spring.application.name=chatapp-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chat_app?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:chatapp}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
logging.pattern.level=%5p [requestId=%X{requestId}]